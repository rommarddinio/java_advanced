services:

  api-gateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile
    environment:
      - USER_SERVICE=${USER_SERVICE:-http://user-service:8080}
      - AUTH_SERVICE=${AUTH_SERVICE:-http://auth-service:8081}
      - ORDER_SERVICE=${ORDER_SERVICE:-http://order-service:8082}
      - PAYMENT_SERVICE=${PAYMENT_SERVICE:-http://payment-service:8084}
      - SERVICE_SECRET=${SERVICE_SECRET:-default_secret}
      - JWT_SECRET=${JWT_SECRET:-rFJ8mYk2YcPz6w0QvV2J0s3vQ8j8XzqV2d1v7cZp8xQ=}
    ports:
      - "8083:8083"
    depends_on:
      - user-service
      - auth-service
      - order-service
      - payment-service

  user-service:
    build:
      context: ./userservice
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - DB_URL=${USER_DB_URL:-jdbc:postgresql://user-postgres:5432/userDB}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-default_password}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST:-redis}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:-rFJ8mYk2YcPz6w0QvV2J0s3vQ8j8XzqV2d1v7cZp8xQ=}
      - SERVICE_SECRET=${SERVICE_SECRET:-default_secret}
    ports:
      - "8080:8080"
    depends_on:
      - user-postgres
      - redis

  auth-service:
    build:
      context: ./authenticationservice
      dockerfile: Dockerfile
    environment:
      - JWT_SECRET=${JWT_SECRET:-rFJ8mYk2YcPz6w0QvV2J0s3vQ8j8XzqV2d1v7cZp8xQ=}
      - JWT_ACCESS_TIME=${JWT_ACCESS_TIME:-5m}
      - JWT_REFRESH_TIME=${JWT_REFRESH_TIME:-3d}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - DB_URL=${AUTH_DB_URL:-jdbc:postgresql://auth-postgres:5432/authDB}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-default_password}
    ports:
      - "8081:8081"
    depends_on:
      - auth-postgres

  order-service:
    build:
      context: ./orderservice
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - DB_URL=${ORDER_DB_URL:-jdbc:postgresql://order-postgres:5432/orderDB}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-default_password}
      - JWT_SECRET=${JWT_SECRET:-rFJ8mYk2YcPz6w0QvV2J0s3vQ8j8XzqV2d1v7cZp8xQ=}
      - USER_SERVICE_URL=${USER_SERVICE_URL:-http://user-service:8080/users}
      - KAFKA_URI=${KAFKA_URI:-kafka:9092}
    ports:
      - "8082:8082"
    depends_on:
      - order-postgres
  
  payment-service :
    container_name : paymentservice
    build :
      context : ./paymentservice
      dockerfile : Dockerfile
    environment :
      - MONGODB_URL=${MONGODB_URL:-mongodb://mongodb:27017/paymentservicedb}
      - RANDOM_NUMBER_URL=${RANDOM_NUMBER_URL:-https://www.random.org/integers/?num=1&min=1&max=100&col=1&base=10&format=plain&rnd=new}
      - JWT_SECRET=${JWT_SECRET:-rOooOOO2YcPz6w0QOOOO0s3vQ8j8XzqV2d1v7cZp8xQ=}
      - KAFKA_HOST=${KAFKA_HOST:-kafka:9092}
    ports :
      - "8084:8084"
    depends_on :
      - kafka
      - mongodb

  user-postgres:
    image: postgres
    environment:
      - POSTGRES_DB=${USER_DB_NAME:-userDB}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-default_password}
    ports:
      - "5432:5432"

  auth-postgres:
    image: postgres
    environment:
      - POSTGRES_DB=${AUTH_DB_NAME:-authDB}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-default_password}
    ports:
      - "5433:5432"

  order-postgres:
    image: postgres
    environment:
      - POSTGRES_DB=${ORDER_DB_NAME:-orderDB}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-default_password}
    ports:
      - "5434:5432"

  redis:
    image: redis
    ports:
      - "6379:6379"

  kafka :
    image : apache/kafka:3.7.0
    container_name : kafka
    ports :
      - "9092:9092"
      - "9094:9094"
    environment :
      KAFKA_NODE_ID : 1
      KAFKA_PROCESS_ROLES : broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS : 1@localhost:9093
      KAFKA_LISTENERS : INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS : INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES : CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP : INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME : INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE : "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR : 1

  mongodb :
    image : mongodb/mongodb-atlas-local
    container_name : mongodb
    ports :
      - "27017:27017"