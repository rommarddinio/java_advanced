databaseChangeLog:
  - changeSet:
      id: 001-create-credentials-table
      author: Roman
      changes:
        - createTable:
            tableName: credentials
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(30)
                  defaultValue: 'ROLE_USER'
                  constraints:
                    nullable: false
              - column:
                  name: login
                  type: text
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: password
                  type: text
                  constraints:
                    nullable: false