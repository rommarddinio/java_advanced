databaseChangeLog:
  - changeSet:
      id: 002
      author: Roman
      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey : true
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable : false
                    unique : true
              - column:
                  name: price
                  type: decimal
                  constraints:
                    nullable : false